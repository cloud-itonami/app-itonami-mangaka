<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e14">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar" id="topbar">
  <button class="btn" id="back-btn" type="button" hidden aria-label="一覧に戻る">←</button>
  <div class="topbar-title">
    <h1 id="screen-title">Mangaka 作品一覧</h1>
    <p class="sub" id="screen-sub">公開リーダーの実 UI — 作品一覧から読書画面へ</p>
  </div>
  <button class="btn" id="refresh-btn" type="button" aria-label="更新">↻</button>
</header>
<main id="panel">
  <section id="screen-works" aria-label="作品一覧">
    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="タイトル・シリーズ・ジャンルで絞る" aria-label="作品を絞る">
      <span class="count-label" id="count-label"></span>
    </div>
    <div id="works-status"></div>
    <div class="grid" id="works-grid"></div>
  </section>

  <section id="screen-reader" aria-label="作品リーダー" hidden>
    <div class="versions" id="versions" hidden></div>
    <div class="reader-bar">
      <span class="reader-meta" id="reader-meta"></span>
      <span class="spacer"></span>
      <button class="btn mode-btn" id="m-spread" type="button" title="見開き（右→左）">見開き</button>
      <button class="btn mode-btn" id="m-single" type="button" title="単ページ">単頁</button>
      <button class="btn mode-btn" id="m-scroll" type="button" title="縦スクロール">縦読</button>
    </div>
    <div id="reader-status"></div>
    <div class="stage" id="stage">
      <div class="spread" id="spread"></div>
      <div class="zone left" id="z-left" role="button" aria-label="次へ"></div>
      <div class="zone right" id="z-right" role="button" aria-label="前へ"></div>
    </div>
    <div class="scroll" id="scroll"></div>
    <div class="count" id="count"></div>
    <p class="hint" id="hint">左端タップ＝次へ　/　右端タップ＝前へ　/　フリックでも移動</p>
  </section>

  <section id="screen-about" aria-label="このアプリについて" hidden>
    <h2>このアプリについて</h2>
    <div id="about-body"></div>
  </section>
</main>
<nav class="bottom-nav" id="bottom-nav" aria-label="画面切り替え">
  <button class="nav-btn is-active" id="nav-works" type="button">よむ</button>
  <button class="nav-btn" id="nav-about" type="button">について</button>
</nav>
<noscript><p class="problem">このアプリは JavaScript を使います。</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
