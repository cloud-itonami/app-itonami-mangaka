name: app
on:
  pull_request:
    paths: ["app/**", "blueprint.edn"]
  push:
    branches: [main]
    paths: ["app/**", "blueprint.edn"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
